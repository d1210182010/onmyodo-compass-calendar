<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>遊行神3D</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="loading-overlay">
    <div id="loading-text">讀取資料中...</div>
    <div id="error-log"></div>
  </div>

  <div id="top-bar">
    <h1 id="app-title">陰陽寮</h1>

    <!-- ✅ 語系切換 -->
    <div id="lang-switch" aria-label="Language switcher">
      <button id="lang-zh" data-lang="zh-TW">中文</button>
      <button id="lang-ja" data-lang="ja">日本語</button>
      <button id="lang-en" data-lang="en">English</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <!-- ✅ 2D 土公面板（高亮區塊） -->
  <div id="doko-map-panel">
    <div id="doko-map-title">
      <div class="t" id="doko-title">土公</div>
      <div class="s" id="doko-subtitle">當日位置（以高亮標示））</div>
    </div>
    <canvas id="doko-map" width="520" height="520"></canvas>
    <div id="doko-map-legend">
      <span class="badge"><span class="dot hl"></span><span id="doko-legend">高亮標示表示當日所在位置</span></span>
    </div>
  </div>

  <div id="ui-container">
    <div id="date-header">
      <div id="date-display">---</div>
      <div id="ganzhi-display">---</div>
    </div>

    <div id="info-grid">
      <div class="info-cell"><span id="lbl-ten">● 天一神</span><span id="val-ten" class="val-good">---</span></div>
      <div class="info-cell"><span id="lbl-tai">▲ 大將軍</span><span id="val-tai" class="val-bad">---</span></div>
      <div class="info-cell"><span id="lbl-nic">■ 日遊神</span><span id="val-nic">---</span></div>
      <div class="info-cell"><span id="lbl-doko">▼ 土公神</span><span id="val-doko">---</span></div>
      <div class="info-cell"><span id="lbl-kon">× 金神</span><span id="val-kon" class="val-bad">---</span></div>
      <div class="info-cell"><span id="lbl-spec">⚠️ 特殊</span><span id="val-spec">---</span></div>
    </div>

    <div class="controls-row">
      <button id="btn-prev">◀</button>
      <button id="btn-play">自動</button>
      <button id="btn-next">▶</button>
      <input type="date" id="date-picker" />
      <input type="range" id="date-slider" min="0" max="100" value="0" step="1" />
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

  <script src="script.js"></script>
</body>
</html>
